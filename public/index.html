<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página Inicial</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Formulário para coleta de Feedbacks</h1>
    <hr />
    <div id="formulario">
      <form action="/feedbacks/enviar" method="post">
        <label for="nome">Nome:</label>
        <input
          type="text"
          name="nome"
          id="nome"
          placeholder="Digite seu nome aqui"
        />
        <br />
        <label for="feedback">Comentário:</label>
        <input
          type="text"
          name="feedback"
          id="feedback"
          placeholder="Digite seu comentário (feedback) aqui"
        />
        <br />
        <button type="submit">Enviar</button>
      </form>
    </div>
  </body>
</html>
